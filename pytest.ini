[pytest]
DJANGO_SETTINGS_MODULE = banking_system.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Tests
python_functions = test_*
addopts =
    --reuse-db
    --nomigrations
    --cov=accounts
    --cov=transactions
    --cov=core
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
testpaths = accounts transactions core
