version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sistema_banco_postgres
    environment:
      POSTGRES_DB: sistema_banco_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sistema_banco_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
