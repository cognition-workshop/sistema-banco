{% extends 'admin/base.html' %}

{% block admin_title %}Analytics & Reports{% endblock %}

{% block admin_content %}
<div class="admin-card mb-4">
    <h2 class="text-xl font-bold mb-4">Transaction Volume Over Time</h2>
    <canvas id="volumeChart" height="80"></canvas>
</div>

<div class="admin-card mb-4">
    <h2 class="text-xl font-bold mb-4">Balance Growth</h2>
    <canvas id="balanceChart" height="80"></canvas>
</div>

<div class="admin-card mb-4">
    <h2 class="text-xl font-bold mb-4">Transaction Type Distribution</h2>
    <canvas id="distributionChart" height="80"></canvas>
</div>

<div class="admin-card">
    <h2 class="text-xl font-bold mb-4">Export Reports</h2>
    <div class="space-y-2">
        <a href="{% url 'admin:export_transactions' %}?format=csv" class="inline-block bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Export CSV</a>
        <a href="{% url 'admin:export_transactions' %}?format=excel" class="inline-block bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Export Excel</a>
        <a href="{% url 'admin:export_transactions' %}?format=pdf" class="inline-block bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Export PDF</a>
    </div>
</div>

<script>
fetch('/admin/analytics/api/?type=volume&days={{ days }}')
    .then(response => response.json())
    .then(data => {
        const ctx = document.getElementById('volumeChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: data.datasets.map(ds => ({
                    ...ds,
                    borderColor: 'rgb(59, 130, 246)',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    tension: 0.1
                }))
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true }
                }
            }
        });
    });

fetch('/admin/analytics/api/?type=balance&days={{ days }}')
    .then(response => response.json())
    .then(data => {
        const ctx = document.getElementById('balanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: data.datasets.map(ds => ({
                    ...ds,
                    borderColor: 'rgb(34, 197, 94)',
                    backgroundColor: 'rgba(34, 197, 94, 0.1)',
                    tension: 0.1
                }))
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true }
                }
            }
        });
    });

fetch('/admin/analytics/api/?type=distribution&days={{ days }}')
    .then(response => response.json())
    .then(data => {
        const ctx = document.getElementById('distributionChart').getContext('2d');
        new Chart(ctx, {
            type: 'pie',
            data: {
                labels: data.labels,
                datasets: data.datasets.map(ds => ({
                    ...ds,
                    backgroundColor: [
                        'rgb(34, 197, 94)',
                        'rgb(239, 68, 68)',
                        'rgb(59, 130, 246)'
                    ]
                }))
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true, position: 'bottom' }
                }
            }
        });
    });
</script>
{% endblock %}
