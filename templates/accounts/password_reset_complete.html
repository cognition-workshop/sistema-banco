{% extends 'core/base.html' %}

{% block head_title %}Password Reset Complete - Banking System{% endblock %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10">Password Reset Complete</h1>
<hr>
<div class="w-full mt-10">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <p class="mb-4 text-gray-700">
            Your password has been successfully reset. You can now log in with your new password.
        </p>
        <div class="flex items-center justify-center">
            <a href="{% url 'accounts:user_login' %}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
