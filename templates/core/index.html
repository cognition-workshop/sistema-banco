{% extends 'core/base.html' %}

{% block head_title %}Banking System{% endblock %}

{% block content %}
    <div class="container mx-auto flex flex-col md:flex-row items-center my-16 md:my-32 px-6">
        <div class="flex flex-col w-full lg:w-1/2 justify-center items-start pb-24 px-6">
            <h1 class="font-bold text-5xl md:text-6xl text-gray-800 mb-6 leading-tight">
                Modern Banking <span class="text-blue-600">System</span>
            </h1>
            <p class="text-lg text-gray-600 mb-8 leading-relaxed">
                Experience seamless banking with our secure and user-friendly platform. 
                Manage your finances with ease and confidence.
            </p>
            <div class="flex space-x-4">
                <a href="{% url 'accounts:user_registration' %}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-lg hover:shadow-xl transition duration-300 py-3 px-8">
                    Get Started
                </a>
                <a href="https://github.com/saadmk11/banking-system" target="_blank" class="bg-white hover:bg-gray-50 text-gray-800 font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-300 py-3 px-8 border border-gray-300">
                    View on GitHub
                </a>
            </div>
        </div>
        <div class="w-full lg:w-1/2 lg:py-6 text-center">
            <div class="text-blue-600 text-9xl font-black opacity-20">
                💰
            </div>
        </div>
    </div>
{% endblock %}
