{% extends 'core/base.html' %}

{% block head_title %}Banking System{% endblock %}

{% block content %}
    <div class="container mx-auto flex flex-col md:flex-row items-center my-12 md:my-24">
        <div class="flex flex-col w-full lg:w-1/2 justify-center items-start pt-12 pb-24 px-6">
            <h1 class="font-bold text-5xl my-4 text-gray-900">Banking System</h1>
            <p class="leading-relaxed mb-6 text-gray-700 text-lg">
                This is an Example web application created using django.
                You can find the source code on <a href="https://github.com/saadmk11/banking-system" class="text-blue-600 hover:text-blue-800 hover:underline transition-all duration-200">GitHub</a>
            </p>
            <div class="flex gap-4">
            <a href="{% url 'accounts:user_registration' %}" class="bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-xl py-3 px-6 transform hover:scale-105 transition-all duration-200">Register</a>
            <a href="https://github.com/saadmk11/banking-system" class="bg-transparent hover:bg-gray-800 text-gray-800 hover:text-white font-semibold rounded-lg shadow-md hover:shadow-lg py-3 px-6 border-2 border-gray-800 hover:border-transparent transform hover:scale-105 transition-all duration-200">GitHub</a>
            </div>
        </div>
        <div class="w-full lg:w-1/2 lg:py-6 text-center">
            <h1 style="font-size: 12rem" class="font-black text-gray-800 opacity-80 hover:opacity-100 transition-opacity duration-300">$$$</h1>
        </div>
    </div>
{% endblock %}
