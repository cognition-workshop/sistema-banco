{% extends 'core/base.html' %}

{% block head_title %}Banking System{% endblock %}

{% block content %}
    <div class="home-grid">
        <div>
            <h1 class="md-typescale-display-medium" style="margin: 0 0 24px;">Banking System</h1>
            <p class="md-typescale-body-large" style="margin: 0 0 32px; line-height: 1.6;">
                A modern web application for managing your banking transactions.
            </p>
            <md-filled-button href="{% url 'transactions:transaction_report' %}">
                View Transactions
            </md-filled-button>
        </div>
        <div style="text-align: center;">
            <h1 style="font-size: 12rem; margin: 0; color: var(--md-sys-color-secondary); font-weight: 900;">$$$</h1>
        </div>
    </div>
    
    <style>
        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
            padding: 96px 0;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        @media (max-width: 768px) {
            .home-grid {
                grid-template-columns: 1fr !important;
                padding: 48px 16px !important;
            }
        }
    </style>
{% endblock %}
