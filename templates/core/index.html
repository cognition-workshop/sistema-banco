{% extends 'core/base.html' %}

{% block head_title %}Banking System{% endblock %}

{% block content %}
    <div class="container mx-auto flex flex-col md:flex-row items-center my-12 md:my-24 px-6">
        <div class="flex flex-col w-full lg:w-1/2 justify-center items-start pt-12 pb-24">
            <h1 class="font-bold text-5xl my-4 text-bank-dark">Modern Banking System</h1>
            <p class="leading-normal mb-6 text-gray-700 text-lg">
                A secure and modern web application for managing your banking transactions with ease.
            </p>
            <div class="flex gap-4">
                <a href="{% url 'transactions:transaction_report' %}" 
                   class="btn-primary">
                    View Transactions
                </a>
                <a href="{% url 'transactions:deposit_money' %}" 
                   class="btn-secondary">
                    Make Deposit
                </a>
            </div>
        </div>
        <div class="w-full lg:w-1/2 lg:py-6 text-center">
            <div class="bg-gradient-to-br from-bank-primary to-bank-accent rounded-full w-96 h-96 mx-auto flex items-center justify-center shadow-2xl">
                <svg class="w-64 h-64 text-white" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/>
                    <path fill-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clip-rule="evenodd"/>
                </svg>
            </div>
        </div>
    </div>
{% endblock %}
