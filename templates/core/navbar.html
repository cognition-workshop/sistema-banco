{% load static %}
<nav class="flex items-center justify-between flex-wrap bg-gradient-to-r from-blue-900 to-blue-700 p-6 shadow-lg">
    <div class="flex items-center flex-shrink-0 text-white mr-6">
        <img src="{% static 'images/logo.svg' %}" alt="Bank Logo" class="mr-3">
        <span class="font-bold text-xl tracking-tight">SecureBank</span>
    </div>
    <div class="block lg:hidden">
        <button id="mobile-menu-button" class="flex items-center px-3 py-2 border rounded text-white border-white hover:text-white hover:border-white">
            <i class="fas fa-bars"></i>
        </button>
    </div>
    <div id="mobile-menu" class="w-full block flex-grow lg:flex lg:items-center lg:w-auto mobile-menu">
        {% if request.user.is_authenticated %}
            <div class="text-md lg:flex-grow">
                <a href="{% url 'transactions:transaction_report' %}" class="block mt-4 lg:inline-block lg:mt-0 text-white hover:text-blue-200 mr-4 transition duration-300">
                    <i class="fas fa-chart-line mr-1"></i> Dashboard
                </a>
                <a href="{% url 'transactions:deposit_money' %}" class="block mt-4 lg:inline-block lg:mt-0 text-white hover:text-blue-200 mr-4 transition duration-300">
                    <i class="fas fa-plus-circle mr-1"></i> Depositar
                </a>
                <a href="{% url 'transactions:withdraw_money' %}" class="block mt-4 lg:inline-block lg:mt-0 text-white hover:text-blue-200 transition duration-300">
                    <i class="fas fa-minus-circle mr-1"></i> Sacar
                </a>
            </div>
            <div>
                <a href="{% url 'accounts:user_logout' %}" class="inline-block font-medium text-sm px-4 py-2 leading-none border rounded text-white border-white hover:bg-white hover:text-blue-900 mt-4 lg:mt-0 transition duration-300">
                    <i class="fas fa-sign-out-alt mr-1"></i> Sair
                </a>
            </div>
        {% else %}
            <div class="text-md lg:flex-grow"></div>
            <div>
                <a href="{% url 'accounts:user_login' %}" class="mr-2 inline-block font-medium text-sm px-4 py-2 leading-none border rounded text-white border-white hover:bg-white hover:text-blue-900 mt-4 lg:mt-0 transition duration-300">
                    <i class="fas fa-sign-in-alt mr-1"></i> Entrar
                </a>
                <a href="{% url 'accounts:user_registration' %}" class="inline-block font-medium text-sm px-4 py-2 leading-none bg-white text-blue-900 rounded hover:bg-blue-100 mt-4 lg:mt-0 transition duration-300">
                    <i class="fas fa-user-plus mr-1"></i> Registrar
                </a>
            </div>
        {% endif %}
    </div>
</nav>
