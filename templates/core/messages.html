{% for message in messages %}
{% if message.tags == 'success' %}
<div class="bg-green-50 border-l-4 border-green-500 rounded-r-lg p-4 shadow-md mb-4 animate-fade-in" role="alert">
    <div class="flex items-center">
        <i class="fas fa-check-circle text-green-500 text-2xl mr-4"></i>
        <div>
            <p class="font-bold text-green-800">Sucesso!</p>
            <p class="text-green-700">{{ message }}</p>
        </div>
    </div>
</div>
{% elif message.tags == 'error' %}
<div class="bg-red-50 border-l-4 border-red-500 rounded-r-lg p-4 shadow-md mb-4 animate-fade-in" role="alert">
    <div class="flex items-center">
        <i class="fas fa-exclamation-circle text-red-500 text-2xl mr-4"></i>
        <div>
            <p class="font-bold text-red-800">Erro!</p>
            <p class="text-red-700">{{ message }}</p>
        </div>
    </div>
</div>
{% else %}
<div class="bg-blue-50 border-l-4 border-blue-500 rounded-r-lg p-4 shadow-md mb-4 animate-fade-in" role="alert">
    <div class="flex items-center">
        <i class="fas fa-info-circle text-blue-500 text-2xl mr-4"></i>
        <div>
            <p class="font-bold text-blue-800">Informação</p>
            <p class="text-blue-700">{{ message }}</p>
        </div>
    </div>
</div>
{% endif %}
{% endfor %}
