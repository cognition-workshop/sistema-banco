<div x-data="toastManager()" class="fixed top-4 right-4 z-50 space-y-2">
    <template x-for="toast in toasts" :key="toast.id">
        <div 
            x-show="true"
            x-transition:enter="transform ease-out duration-300 transition"
            x-transition:enter-start="translate-x-full opacity-0"
            x-transition:enter-end="translate-x-0 opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            :class="getColors(toast.type)"
            class="flex items-center p-4 rounded-lg shadow-lg border-l-4 min-w-[320px] max-w-md"
        >
            <div x-html="getIcon(toast.type)" class="flex-shrink-0 mr-3"></div>
            <div class="flex-1">
                <p class="text-sm font-medium" x-text="toast.message"></p>
            </div>
            <button @click="removeToast(toast.id)" class="ml-3 flex-shrink-0 text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </template>
</div>

{% for message in messages %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        window.showToast('{{ message|escapejs }}', '{{ message.tags|default:"info" }}');
    });
</script>
{% endfor %}
