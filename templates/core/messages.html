{% for message in messages %}
<div class="rounded-md p-4 mb-4 mx-4 mt-4
    {% if message.tags == 'success' %}bg-green-50 border-l-4 border-green-400{% endif %}
    {% if message.tags == 'error' %}bg-red-50 border-l-4 border-red-400{% endif %}
    {% if message.tags == 'warning' %}bg-yellow-50 border-l-4 border-yellow-400{% endif %}
    {% if message.tags == 'info' %}bg-blue-50 border-l-4 border-blue-400{% endif %}
" role="alert">
    <div class="flex">
        <div class="flex-shrink-0">
            <i class="fas fa-check-circle text-green-400"></i>
        </div>
        <div class="ml-3">
            <p class="text-sm font-medium text-green-800">{{ message }}</p>
        </div>
    </div>
</div>
{% endfor %}
