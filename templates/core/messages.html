{% if messages %}
    {% for message in messages %}
    <div class="rounded-lg p-4 mb-4 flex items-start shadow-md
        {% if message.tags == 'success' %}bg-green-50 border-l-4 border-green-500
        {% elif message.tags == 'error' %}bg-red-50 border-l-4 border-red-500
        {% elif message.tags == 'warning' %}bg-yellow-50 border-l-4 border-yellow-500
        {% else %}bg-blue-50 border-l-4 border-blue-500{% endif %}" 
        role="alert">
        <div class="flex-shrink-0">
            {% if message.tags == 'success' %}
            <svg class="h-6 w-6 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            {% elif message.tags == 'error' %}
            <svg class="h-6 w-6 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
            {% endif %}
        </div>
        <div class="ml-3">
            <p class="text-sm font-medium {% if message.tags == 'success' %}text-green-800{% elif message.tags == 'error' %}text-red-800{% else %}text-blue-800{% endif %}">
                {{ message }}
            </p>
        </div>
    </div>
    {% endfor %}
{% endif %}
