{% for message in messages %}
<div class="max-w-4xl mx-auto mt-4">
    <div class="bg-gradient-to-r from-green-400 to-green-500 border-l-4 border-green-600 rounded-lg text-white px-6 py-4 shadow-lg" role="alert">
        <div class="flex items-center">
            <div class="py-1">
                <svg class="fill-current h-6 w-6 text-white mr-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                    <path d="M2.93 17.07A10 10 0 1 1 17.07 2.93 10 10 0 0 1 2.93 17.07zm12.73-1.41A8 8 0 1 0 4.34 4.34a8 8 0 0 0 11.32 11.32zM9 11V9h2v6H9v-4zm0-6h2v2H9V5z"/>
                </svg>
            </div>
            <div>
                <p class="font-bold text-lg">Success!</p>
                <p class="text-sm">{{ message }}</p>
            </div>
        </div>
    </div>
</div>
{% endfor %}
