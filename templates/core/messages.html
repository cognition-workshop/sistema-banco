{% for message in messages %}
<div class="bg-gradient-to-r from-emerald-50 to-blue-50 border-l-4 border-emerald-500 rounded-r-lg text-slate-900 px-6 py-4 shadow-lg hover:shadow-xl mt-4 animate-fade-in" role="alert">
    <div class="flex items-start">
        <div class="flex-shrink-0">
            <svg class="h-6 w-6 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <div class="ml-4">
            <p class="font-bold text-emerald-700 text-lg">Success!</p>
            <p class="text-slate-700 mt-1">{{ message }}</p>
        </div>
    </div>
</div>
{% endfor %}
