{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 py-12">
    <div class="container mx-auto px-6 max-w-2xl">
        <div class="bg-white shadow-2xl rounded-lg p-8 fade-in">
            <h1 class="font-bold text-3xl text-center mb-2 text-gray-800">{{ title }}</h1>
            <p class="text-center text-gray-600 mb-8">Insira o valor da transação</p>
            <hr class="mb-8" />
            <form method="post">
                {% csrf_token %}
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                        Valor
                    </label>
                    <div class="input-with-icon">
                        <i class="fas fa-dollar-sign"></i>
                        <input class="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 leading-tight border-gray-300 focus:outline-none focus:border-blue-500 transition" name="amount" id="amount" type="text" required placeholder="R$ 0,00">
                    </div>
                    {% if form.amount.errors %}
                        {% for error in form.amount.errors %}
                            <p class="text-red-600 text-sm italic mt-2">{{ error }}</p>
                        {% endfor %}
                    {% endif %}
                </div>
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:shadow-outline transition duration-300" type="submit">
                    <i class="fas fa-check mr-2"></i>Confirmar Transação
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
