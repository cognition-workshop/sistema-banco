{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="banking-header rounded-lg mb-8">
        <div class="px-6 py-8">
            <h1 class="text-3xl font-bold">{{ title }}</h1>
            <p class="text-blue-100 mt-2">Enter the amount for your transaction</p>
        </div>
    </div>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                    Amount ($)
                </label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-500 text-lg">$</span>
                    <input class="form-input pl-8" name="amount" id="amount" type="number" step="0.01" required placeholder="0.00" min="0.01">
                </div>
            </div>
            {% if form.amount.errors %}
                {% for error in form.amount.errors %}
                    <p class="text-red-600 text-sm italic pb-2">{{ error }}</p>
                {% endfor %}
            {% endif %}
            <button class="btn-primary w-full text-center" type="submit">
                Submit Transaction
            </button>
        </form>
    </div>
</div>
{% endblock %}
