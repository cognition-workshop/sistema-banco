{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="font-bold text-4xl text-center text-gray-800 pb-6 pt-10">{{ title }}</h1>
<p class="text-center text-gray-600 mb-8">Enter the amount for your transaction</p>
<div class="max-w-md mx-auto mt-10">
    <form method="post" class="bg-white shadow-xl rounded-lg px-10 pt-8 pb-10 mb-4">
        {% csrf_token %}

        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-3" for="amount">
                Amount ($)
            </label>
            <input class="shadow-sm appearance-none border-2 border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition duration-200" name="amount" id="amount" type="number" step="0.01" required placeholder="0.00">
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="text-red-600 text-sm italic pb-2 bg-red-50 p-3 rounded-lg mb-4">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-200 shadow-lg hover:shadow-xl" type="submit">
            Submit Transaction
        </button>
    </form>
</div>
{% endblock %}
