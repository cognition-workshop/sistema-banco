{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10">{{ title }}</h1>
<hr />
<div class="w-full mt-5">
    <form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4" id="transactionForm">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                Amount
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight border rounded-md border-gray-500 focus:outline-none focus:shadow-outline" name="amount" id="amount" type="number" step="0.01" required placeholder="Amount">
            <p id="amountError" class="text-red-600 text-sm italic mt-2 hidden"></p>
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="text-red-600 text-sm italic pb-2">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
            Submit
        </button>
    </form>
</div>

<script>
document.getElementById('transactionForm').addEventListener('submit', function(e) {
    const amountInput = document.getElementById('amount');
    const errorElement = document.getElementById('amountError');
    const amount = parseFloat(amountInput.value);
    
    errorElement.classList.add('hidden');
    
    if (isNaN(amount) || amount <= 0) {
        e.preventDefault();
        errorElement.textContent = 'O valor deve ser maior que zero';
        errorElement.classList.remove('hidden');
        amountInput.focus();
        return false;
    }
});
</script>
{% endblock %}
