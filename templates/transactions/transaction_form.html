{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="font-bold text-4xl text-center pb-8 pt-12 text-slate-900">{{ title }}</h1>
<div class="w-24 h-1 bg-gradient-to-r from-blue-600 to-indigo-700 mx-auto mb-8 rounded"></div>
<div class="w-full mt-5 max-w-md mx-auto">
    <form method="post" class="bg-white shadow-xl rounded-lg px-8 md:px-10 pt-8 pb-10 mb-4 border border-slate-200">
        {% csrf_token %}

        <div class="mb-8">
            <label class="block text-slate-700 text-sm font-semibold mb-3" for="amount">
                Amount
            </label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 text-lg">$</span>
                <input class="shadow-sm appearance-none border border-slate-300 rounded-lg w-full py-3 pl-8 pr-3 text-slate-900 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors duration-200" name="amount" id="amount" type="number" required placeholder="0.00" step="0.01">
            </div>
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="text-red-600 text-sm italic mb-4">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <button class="w-full bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-200" type="submit">
            Submit Transaction
        </button>
    </form>
</div>
{% endblock %}
