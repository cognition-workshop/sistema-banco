{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="md-typescale-headline-medium" style="text-align: center; padding: 40px 0 20px;">{{ title }}</h1>
<hr style="border: none; border-top: 1px solid var(--md-sys-color-outline); margin-bottom: 32px;" />
<div style="max-width: 600px; margin: 0 auto;">
    <form method="post" class="md-card">
        {% csrf_token %}

        <div style="margin-bottom: 24px;">
            <md-outlined-text-field
                label="Amount"
                name="amount"
                id="amount"
                type="number"
                required
                style="width: 100%;"
                value="{{ form.amount.value|default:'' }}"
            ></md-outlined-text-field>
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="error-text">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <md-filled-button type="submit" style="margin-top: 16px;">
            Submit
        </md-filled-button>
    </form>
</div>
{% endblock %}
