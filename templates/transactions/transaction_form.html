{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="font-mono font-bold text-4xl text-center pb-5 pt-10 text-gray-800">{{ title }}</h1>
<hr class="border-gray-300 mb-8" />
<div class="w-full max-w-md mx-auto mt-5">
    <form method="post" class="bg-white shadow-xl rounded-lg px-8 pt-8 pb-10 mb-4">
        {% csrf_token %}

        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                Amount
            </label>
            <input class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" name="amount" id="amount" type="number" required placeholder="Enter amount">
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="text-red-600 text-sm italic pb-2">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <button class="w-full bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shadow-md hover:shadow-lg transform hover:scale-105 transition-all duration-200" type="submit">
            Submit
        </button>
    </form>
</div>
{% endblock %}
