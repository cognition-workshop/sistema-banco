{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10">{{ title }}</h1>
<hr />
<div class="w-full mt-5">
    <form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4" id="transaction-form">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                Valor
            </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight border rounded-md border-gray-500 focus:outline-none focus:shadow-outline" 
                   name="amount" 
                   id="amount" 
                   type="number" 
                   step="0.01"
                   min="0.01"
                   required 
                   placeholder="Valor">
            <p id="amount-error" class="text-red-600 text-sm italic pt-2 hidden"></p>
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="text-red-600 text-sm italic pb-2">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
            Enviar
        </button>
    </form>
</div>

<script>
document.getElementById('transaction-form').addEventListener('submit', function(e) {
    const amountInput = document.getElementById('amount');
    const errorDisplay = document.getElementById('amount-error');
    const amount = parseFloat(amountInput.value);
    
    errorDisplay.classList.add('hidden');
    
    if (isNaN(amount) || amount <= 0) {
        e.preventDefault();
        errorDisplay.textContent = 'Por favor, insira um valor válido maior que zero.';
        errorDisplay.classList.remove('hidden');
        return false;
    }
    
    {% if 'Sacar' in title or 'Withdraw' in title %}
    const balance = {{ account.balance|default:0 }};
    if (amount > balance) {
        e.preventDefault();
        errorDisplay.textContent = `Saldo insuficiente. Saldo disponível: R$ ${balance.toFixed(2)}`;
        errorDisplay.classList.remove('hidden');
        return false;
    }
    {% endif %}
    
    return true;
});

document.getElementById('amount').addEventListener('input', function(e) {
    const errorDisplay = document.getElementById('amount-error');
    const amount = parseFloat(e.target.value);
    
    if (isNaN(amount) || amount <= 0) {
        errorDisplay.textContent = 'Valor deve ser maior que zero';
        errorDisplay.classList.remove('hidden');
    } else {
        errorDisplay.classList.add('hidden');
    }
});
</script>
{% endblock %}
