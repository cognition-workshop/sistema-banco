{% extends 'core/base.html' %}

{% block head_title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10 text-bank-dark">{{ title }}</h1>
<hr class="border-bank-light" />
<div class="w-full mt-5 max-w-2xl mx-auto">
    <div id="form-result"></div>
    <form method="post" 
          hx-post="{{ request.path }}" 
          hx-target="#form-result" 
          hx-swap="innerHTML"
          class="bg-white shadow-md rounded-lg px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                Amount ($)
            </label>
            <input class="form-input" name="amount" id="amount" type="number" step="0.01" required placeholder="Enter amount">
        </div>
        {% if form.amount.errors %}
            {% for error in form.amount.errors %}
                <p class="text-red-600 text-sm italic pb-2">{{ error }}</p>
            {% endfor %}
        {% endif %}
        <button class="btn-primary" type="submit">
            <span class="htmx-indicator">
                <span class="spinner inline-block mr-2"></span>
            </span>
            Submit
        </button>
    </form>
</div>
{% endblock %}
