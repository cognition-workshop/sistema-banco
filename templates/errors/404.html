{% extends 'core/base.html' %}

{% block head_title %}Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-10">
    <h1 class="text-6xl font-bold text-gray-800">404</h1>
    <p class="text-xl text-gray-600 mt-4">Page not found</p>
    <p class="text-gray-500 mt-2">The page you're looking for doesn't exist.</p>
    <a href="{% url 'home' %}" class="mt-6 inline-block bg-blue-500 hover:bg-blue-700 text-white px-6 py-2 rounded">
        Go Home
    </a>
</div>
{% endblock %}
