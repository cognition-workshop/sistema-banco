{% extends 'core/base.html' %}

{% block head_title %}Server Error{% endblock %}

{% block content %}
<div class="text-center py-10">
    <h1 class="text-6xl font-bold text-gray-800">500</h1>
    <p class="text-xl text-gray-600 mt-4">Internal Server Error</p>
    <p class="text-gray-500 mt-2">Something went wrong on our end. Please try again later.</p>
    {% if error_message %}
    <div class="mt-4 p-4 bg-red-100 text-red-700 rounded max-w-2xl mx-auto">
        <p class="font-mono text-sm">{{ error_message }}</p>
    </div>
    {% endif %}
    <a href="{% url 'home' %}" class="mt-6 inline-block bg-blue-500 hover:bg-blue-700 text-white px-6 py-2 rounded">
        Go Home
    </a>
</div>
{% endblock %}
