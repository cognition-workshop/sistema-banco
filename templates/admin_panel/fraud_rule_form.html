{% extends 'admin_panel/base_admin.html' %}

{% block head_title %}Create Fraud Detection Rule{% endblock %}

{% block admin_content %}
<div class="mb-8">
    <a href="{% url 'admin_panel:fraud_rules' %}" class="text-bank-primary hover:text-bank-dark">
        ← Back to Rules
    </a>
</div>

<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold text-bank-dark mb-6">Create Fraud Detection Rule</h2>
        <form method="post">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Rule Name</label>
                    <input type="text" name="name" class="form-input" required>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
                    <textarea name="description" rows="3" class="form-input" required></textarea>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Rule Type</label>
                    <select name="rule_type" class="form-input" required>
                        <option value="amount_threshold">Amount Threshold</option>
                        <option value="frequency">Frequency</option>
                        <option value="velocity">Velocity</option>
                    </select>
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Threshold Value ($)</label>
                    <input type="number" name="threshold_value" step="0.01" class="form-input">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">Time Window (minutes)</label>
                    <input type="number" name="time_window_minutes" class="form-input">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" name="is_active" checked class="mr-2">
                    <label class="text-gray-700 text-sm font-bold">Active</label>
                </div>
                <div class="flex gap-4">
                    <button type="submit" class="btn-primary">Create Rule</button>
                    <a href="{% url 'admin_panel:fraud_rules' %}" class="btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
