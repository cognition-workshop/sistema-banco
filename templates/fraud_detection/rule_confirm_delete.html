{% extends 'core/base.html' %}

{% block head_title %}Delete Fraud Rule{% endblock %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10">Delete Fraud Rule</h1>
<hr />
<div class="w-full mt-5">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <p class="text-lg mb-4">Are you sure you want to delete the rule "<strong>{{ object.name }}</strong>"?</p>
        <p class="text-gray-600 mb-6">This action cannot be undone.</p>
        
        <form method="post">
            {% csrf_token %}
            <div class="flex gap-2">
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                    Yes, Delete
                </button>
                <a href="{% url 'fraud_detection:rule_list' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
