{% comment %}
Usage: {% include 'components/chat_widget.html' %}
{% endcomment %}
<div id="chatWidget" class="fixed bottom-4 right-4 z-50">
    <button id="chatButton" class="bg-primary hover:bg-primary-dark text-white rounded-full w-16 h-16 flex items-center justify-center shadow-xl transition-all hover:scale-110" aria-label="Abrir chat de atendimento">
        <i class="fas fa-comments text-2xl"></i>
    </button>
    <div id="chatPanel" class="hidden absolute bottom-20 right-0 w-80 sm:w-96 bg-white rounded-lg shadow-2xl border border-gray-200">
        <div class="bg-primary text-white p-4 rounded-t-lg flex items-center justify-between">
            <div>
                <h4 class="font-bold">Atendimento</h4>
                <p class="text-sm opacity-90">Estamos aqui para ajudar!</p>
            </div>
            <button id="chatClose" class="hover:bg-white hover:bg-opacity-20 rounded-full p-2 transition" aria-label="Fechar chat">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="h-96 overflow-y-auto p-4 space-y-4 bg-gray-50" id="chatMessages">
            <div class="flex items-start">
                <div class="bg-white p-3 rounded-lg shadow-sm max-w-xs">
                    <p class="text-sm">Olá! Como posso ajudar você hoje?</p>
                    <p class="text-xs text-gray-500 mt-1">10:30</p>
                </div>
            </div>
        </div>
        <div class="p-4 border-t bg-white rounded-b-lg">
            <div class="flex items-center space-x-2">
                <input type="text" placeholder="Digite sua mensagem..." 
                       class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary text-sm" 
                       id="chatInput" aria-label="Mensagem do chat">
                <button class="bg-primary hover:bg-primary-dark text-white rounded-lg px-4 py-2 transition" 
                        id="chatSend" aria-label="Enviar mensagem">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
