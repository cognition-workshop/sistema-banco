{% comment %}
Usage: {% include 'components/investment_calculator.html' %}
{% endcomment %}
<div class="card">
    <h3 class="text-xl font-bold mb-4">
        <i class="fas fa-chart-line text-accent"></i> Calculadora de Investimentos
    </h3>
    <div class="space-y-6">
        <div>
            <label class="block text-sm font-medium mb-2">Valor Inicial</label>
            <input type="range" id="investAmount" min="100" max="50000" step="100" value="5000" 
                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-accent">
            <div class="text-right font-bold text-accent text-lg mt-2">
                R$ <span id="investAmountDisplay">5.000</span>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Período (meses)</label>
            <input type="range" id="investTerm" min="1" max="60" step="1" value="12" 
                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-accent">
            <div class="text-right font-bold text-lg mt-2">
                <span id="investTermDisplay">12</span> meses
            </div>
        </div>
        <div class="bg-accent-green-light p-6 rounded-lg border-l-4 border-accent">
            <div class="text-sm text-gray-600 mb-1">Valor Final</div>
            <div class="text-3xl font-bold text-accent">
                R$ <span id="futureValue">0</span>
            </div>
            <div class="text-sm text-gray-600 mt-3">
                Rendimento: <span class="font-semibold text-accent">R$ <span id="earnings">0</span></span>
            </div>
            <div class="text-xs text-gray-500 mt-2">
                Rentabilidade estimada: 10% ao ano
            </div>
        </div>
    </div>
</div>
