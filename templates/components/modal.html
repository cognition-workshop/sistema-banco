{% comment %}
Usage: {% include 'components/modal.html' with modal_id="confirmModal" title="Confirm Action" %}
{% endcomment %}
<div id="{{ modal_id }}" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-yellow-100">
                <i class="fas fa-exclamation-triangle text-yellow-600 text-xl"></i>
            </div>
            <h3 class="text-lg leading-6 font-medium text-gray-900 mt-4">{{ title }}</h3>
            <div class="mt-2 px-7 py-3">
                <p class="text-sm text-gray-500">{{ message }}</p>
            </div>
            <div class="items-center px-4 py-3">
                <button id="{{ modal_id }}-confirm" class="px-4 py-2 bg-primary text-white text-base font-medium rounded-md w-24 mr-2 hover:bg-primary-dark">
                    Confirmar
                </button>
                <button id="{{ modal_id }}-cancel" class="px-4 py-2 bg-gray-500 text-white text-base font-medium rounded-md w-24 hover:bg-gray-600">
                    Cancelar
                </button>
            </div>
        </div>
    </div>
</div>
