{% comment %}
Usage: {% include 'components/loan_calculator.html' %}
{% endcomment %}
<div class="card">
    <h3 class="text-xl font-bold mb-4">
        <i class="fas fa-calculator text-primary"></i> Simulador de Empréstimo
    </h3>
    <div class="space-y-6">
        <div>
            <label class="block text-sm font-medium mb-2">Valor do Empréstimo</label>
            <input type="range" id="loanAmount" min="1000" max="100000" step="1000" value="10000" 
                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            <div class="text-right font-bold text-primary text-lg mt-2">
                R$ <span id="loanAmountDisplay">10.000</span>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Prazo (meses)</label>
            <input type="range" id="loanTerm" min="6" max="60" step="6" value="12" 
                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-primary">
            <div class="text-right font-bold text-lg mt-2">
                <span id="loanTermDisplay">12</span> meses
            </div>
        </div>
        <div class="bg-primary-light p-6 rounded-lg border-l-4 border-primary">
            <div class="text-sm text-gray-600 mb-1">Parcela Mensal</div>
            <div class="text-3xl font-bold text-primary">
                R$ <span id="monthlyPayment">0</span>
            </div>
            <div class="text-sm text-gray-600 mt-3">
                Total a Pagar: <span class="font-semibold">R$ <span id="totalPayment">0</span></span>
            </div>
            <div class="text-xs text-gray-500 mt-2">
                Taxa de juros: 12% ao ano
            </div>
        </div>
    </div>
</div>
