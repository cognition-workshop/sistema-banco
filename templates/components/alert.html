{% comment %}
Usage: {% include 'components/alert.html' with type="success" message="Operation successful!" %}
Types: success, error, warning, info
{% endcomment %}
<div class="rounded-md p-4 mb-4 
    {% if type == 'success' %}bg-green-50 border-l-4 border-green-400{% endif %}
    {% if type == 'error' %}bg-red-50 border-l-4 border-red-400{% endif %}
    {% if type == 'warning' %}bg-yellow-50 border-l-4 border-yellow-400{% endif %}
    {% if type == 'info' %}bg-blue-50 border-l-4 border-blue-400{% endif %}
">
    <div class="flex">
        <div class="flex-shrink-0">
            <i class="fas 
                {% if type == 'success' %}fa-check-circle text-green-400{% endif %}
                {% if type == 'error' %}fa-times-circle text-red-400{% endif %}
                {% if type == 'warning' %}fa-exclamation-triangle text-yellow-400{% endif %}
                {% if type == 'info' %}fa-info-circle text-blue-400{% endif %}
            "></i>
        </div>
        <div class="ml-3">
            <p class="text-sm font-medium
                {% if type == 'success' %}text-green-800{% endif %}
                {% if type == 'error' %}text-red-800{% endif %}
                {% if type == 'warning' %}text-yellow-800{% endif %}
                {% if type == 'info' %}text-blue-800{% endif %}
            ">
                {{ message }}
            </p>
        </div>
    </div>
</div>
