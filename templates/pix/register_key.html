{% extends 'core/base.html' %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10">Cadastrar Chave PIX</h1>
<hr />
<div class="w-full mt-10">
    <form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
                Tipo de Chave
            </label>
            {{ form.key_type }}
        </div>
        <div class="mb-4">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
                Valor da Chave
            </label>
            {{ form.key_value }}
            <p class="text-gray-600 text-xs italic mt-2">Para chave aleatória, deixe em branco</p>
        </div>
        {% if form.errors %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                {{ form.errors }}
            </div>
        {% endif %}
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" type="submit">
            Cadastrar
        </button>
        <a href="{% url 'pix:list_keys' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded ml-2">
            Voltar
        </a>
    </form>
</div>
{% endblock %}
