{% extends 'core/base.html' %}

{% block content %}
<h1 class="font-mono font-bold text-3xl text-center pb-5 pt-10">Transferência PIX</h1>
<hr />
<div class="w-full mt-10">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <p class="mb-4"><strong>Saldo disponível:</strong> R$ {{ account.balance }}</p>
    </div>
    
    <form method="post" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
                Chave PIX de Destino
            </label>
            {{ form.pix_key }}
        </div>
        <div class="mb-4">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
                Valor (R$)
            </label>
            {{ form.amount }}
        </div>
        <div class="mb-4">
            <label class="block uppercase tracking-wide text-gray-700 text-xs font-bold mb-2">
                Descrição (Opcional)
            </label>
            {{ form.description }}
        </div>
        {% if form.errors %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                {{ form.errors }}
            </div>
        {% endif %}
        <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded" type="submit">
            Transferir
        </button>
        <a href="{% url 'pix:list_keys' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded ml-2">
            Voltar
        </a>
    </form>
</div>
{% endblock %}
