name: CI/CD Pipeline

on: 
  push:
    branches: [ main, master, CHALLENGE-21 ]
  pull_request:
    branches: [ main, master, CHALLENGE-21 ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:6
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env file
        run: |
          echo "SECRET_KEY=test-secret-key-for-ci" > .env
          echo "DEBUG=True" >> .env
          echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
      
      - name: Run Django checks
        run: python manage.py check
      
      - name: Check for pending migrations
        run: python manage.py makemigrations --check --dry-run
      
      - name: Run migrations
        run: python manage.py migrate
      
      - name: Lint with flake8
        run: flake8 . --max-line-length=100 --exclude=venv,migrations,__pycache__,.git
      
      - name: Format check with black
        run: black --check . --exclude='/(venv|migrations|__pycache__|\.git)/'
      
      - name: Run tests with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing
