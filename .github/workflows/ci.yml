name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_banking
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Django system checks
      run: |
        python manage.py check
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_banking
        REDIS_URL: redis://localhost:6379/0
    
    - name: Check for missing migrations
      run: |
        python manage.py makemigrations --check --dry-run
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_banking
    
    - name: Run migrations
      run: |
        python manage.py migrate
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_banking
    
    - name: Run tests
      run: |
        python manage.py test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_banking
        REDIS_URL: redis://localhost:6379/0
    
    - name: Run linting
      run: |
        pip install flake8 black
        flake8 . --max-line-length=100 --exclude=venv,migrations
        black --check . --exclude=venv
      continue-on-error: true
    
    - name: Run security checks
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json --exclude ./venv
      continue-on-error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deployment steps would go here"
        echo "Example: Deploy to AWS, Heroku, or other cloud platform"
