name: CI/CD Pipeline

on:
  push:
    branches: [ feature/time8_producao, main, master ]
  pull_request:
    branches: [ feature/time8_producao, main, master ]
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run migrations
        run: |
          python manage.py migrate
      
      - name: Run tests
        run: |
          python manage.py test

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Django Check
        run: |
          python manage.py check
      
      - name: Run flake8
        run: |
          flake8 . --count --show-source --statistics
        continue-on-error: true
      
      - name: Check code formatting with black
        run: |
          black --check .
        continue-on-error: true

  deploy:
    name: Deploy (Manual)
    runs-on: ubuntu-latest
    needs: [tests, lint]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature/time8_producao'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deployment Instructions
        run: |
          echo "=== Deploy Instructions ==="
          echo "This project uses SQLite + Redis + Celery"
          echo "Recommended deployment: Docker with docker-compose"
          echo "See Dockerfile and docker-compose.yml for reference"
          echo "=========================="
