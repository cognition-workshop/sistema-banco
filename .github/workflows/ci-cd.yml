name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop, 'team3/**' ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django system checks
      run: |
        python manage.py check
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: True
        CELERY_BROKER_URL: redis://localhost:6379
        CELERY_RESULT_BACKEND: redis://localhost:6379

    - name: Run migrations
      run: |
        python manage.py migrate --noinput
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: True
        CELERY_BROKER_URL: redis://localhost:6379
        CELERY_RESULT_BACKEND: redis://localhost:6379

    - name: Run tests
      run: |
        python manage.py test
      env:
        SECRET_KEY: test-secret-key-for-ci
        DEBUG: True
        CELERY_BROKER_URL: redis://localhost:6379
        CELERY_RESULT_BACKEND: redis://localhost:6379

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics \
          --exclude=venv,migrations,__pycache__,.git

    - name: Check code formatting with black
      run: |
        black --check --line-length=120 --exclude='/(\.git|\.venv|venv|migrations|__pycache__)/' .

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Railway
      run: |
        echo "Deployment step - Configure based on your chosen platform"
        echo "For Railway: Install Railway CLI and run 'railway up'"
        echo "For Heroku: Use heroku/deploy-via-git action"
        echo "For AWS/GCP: Configure your deployment scripts here"
        
    - name: Notify deployment status
      if: always()
      run: |
        echo "Deployment completed. Status: ${{ job.status }}"
