<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="${title}">Transaction - Banking System</title>
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div th:replace="~{layout/navbar :: navbar}"></div>
    
    <div class="lg:container lg:mx-auto">
        <div th:replace="~{layout/messages :: messages}"></div>
        
        <div class="max-w-md mx-auto bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 mt-8">
            <h2 class="text-2xl font-bold mb-6" th:text="${title}">Transaction</h2>
            
            <form th:action="@{${#httpServletRequest.requestURI}}" method="post" th:object="${transactionRequest}">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="amount">
                        Amount ($)
                    </label>
                    <input type="number" 
                           step="0.01"
                           th:field="*{amount}"
                           class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                           id="amount"
                           placeholder="Enter amount" 
                           required />
                    <p th:if="${#fields.hasErrors('amount')}" 
                       th:errors="*{amount}" 
                       class="text-red-500 text-xs italic mt-1"></p>
                </div>
                
                <div class="flex items-center justify-between">
                    <button type="submit" 
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Submit
                    </button>
                    <a th:href="@{/transactions/report}" 
                       class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
    
    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
