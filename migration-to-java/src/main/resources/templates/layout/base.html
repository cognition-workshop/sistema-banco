<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Modern Banking System" />
    <title th:replace="${title} ?: 'Banking System'">Banking System</title>
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
    
    <th:block th:replace="${headExtra} ?: ~{}"></th:block>
</head>
<body class="bg-gray-100">
    <div th:replace="~{layout/navbar :: navbar}"></div>
    
    <div class="lg:container lg:mx-auto">
        <div th:replace="~{layout/messages :: messages}"></div>
        
        <div th:replace="${content}"></div>
    </div>
    
    <div th:replace="~{layout/footer :: footer}"></div>
    
    <th:block th:replace="${footerExtra} ?: ~{}"></th:block>
</body>
</html>
